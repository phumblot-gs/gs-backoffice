name: Promote to Staging on Evolution Merge

# When a PR labelled `deploy:staging` is merged to main (the human's validation gate),
# promote main → staging so the deployment follows without a manual step.
#
# The label is the ONLY trigger, deliberately. This used to also fire on a
# `methods-officer/*` branch prefix, but the loop names its branches after the change
# it makes — so PR #107 (a bot-authored upgrade) matched neither condition, was merged,
# and silently never deployed. The bridge's `open_pr` now applies the label when it
# opens a PR, which puts the intent on the pull request where a reviewer can see it
# before merging, and remove it to withhold the deploy.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write # merge the promotion PR into staging
  pull-requests: write # open the main → staging promotion PR
  actions: write # dispatch the Deploy Staging workflow

# One promotion at a time: two merges in quick succession must not race on staging.
concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main → staging
    runs-on: ubuntu-latest
    # Only on a real merge (not a closed-without-merge), and only when labelled.
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'deploy:staging')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Promote through a PR merged with a MERGE COMMIT, never a direct push or a squash.
      # The `staging-merge-commits-only` ruleset requires a PR and allows only merge
      # commits on staging; a squash dropped main's history from staging twice (#122,
      # #125) and made the next promotion conflict. Personal-account repos cannot list
      # GitHub Actions as a ruleset bypass actor, hence the PR instead of a push.
      # Requires Settings → Actions → General → "Allow GitHub Actions to create and
      # approve pull requests".
      - name: Promote main into staging (PR + merge commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/$REPO/compare/staging...main" --jq '.ahead_by')
          if [ "$ahead" = "0" ]; then
            echo "staging already contains main — nothing to promote."
            exit 0
          fi
          url=$(gh pr list --repo "$REPO" --base staging --head main --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            url=$(gh pr create --repo "$REPO" --base staging --head main \
              --title "Promote main → staging (after #$SOURCE_PR)" \
              --body "Automatic promotion after merging #$SOURCE_PR ($SOURCE_SHA), labelled deploy:staging. Merged with a merge commit by promote-staging.yml.")
          fi
          echo "Promotion PR: $url"
          # GitHub computes mergeability asynchronously right after creation: retry a
          # few times. A real conflict still fails the job — staging must never diverge.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$url" --repo "$REPO" --merge \
                --subject "Promote main → staging (after #$SOURCE_PR)"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "::error::Could not merge the promotion PR $url — check for a conflict."
          exit 1

      # Audit (SOC2): record the human go-live decision (the PR merge) in the backoffice
      # trail — it otherwise lives only in GitHub. Best-effort; never fails the promotion.
      - name: Emit backoffice.evolution.merged
        env:
          EVT_API_URL: ${{ secrets.EVT_API_URL }}
          EVT_API_KEY: ${{ secrets.EVT_API_KEY }}
          EVT_ACCOUNT_ID: ${{ secrets.EVT_ACCOUNT_ID }}
          EVT_EVENT_TYPE: backoffice.evolution.merged
          EVT_RESOURCE_TYPE: evolution
          EVT_RESOURCE_ID: ${{ github.event.pull_request.merge_commit_sha }}
          EVT_ACTOR: ${{ github.event.pull_request.merged_by.login }}
          EVT_PAYLOAD: '{"prNumber":${{ github.event.pull_request.number }},"url":"${{ github.event.pull_request.html_url }}","branch":"${{ github.event.pull_request.head.ref }}","baseRef":"main","mergedBy":"${{ github.event.pull_request.merged_by.login }}","sha":"${{ github.event.pull_request.merge_commit_sha }}"}'
        run: node scripts/emit-evt.mjs

      # A merge made with GITHUB_TOKEN does NOT re-trigger workflows, so trigger the
      # staging deploy explicitly on the freshly-updated staging branch.
      - name: Trigger Deploy Staging
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-staging.yml --ref staging

      - name: Summary
        run: |
          echo "Promoted main → staging after merging PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.ref }})." >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy Staging dispatched on the staging branch." >> "$GITHUB_STEP_SUMMARY"
